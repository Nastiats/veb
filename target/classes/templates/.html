<div th:fragment="body" xmlns:th="http://www.w3.org/1999/xhtml">

    <div class="containeer">
        <div class="row col-md-10">
            <h2>Расписание поездов</h2>
        </div>
        <div class="table-container">
         <table >
            <thread>
                <tr>
                    <th><a class="sorted" sd:pagination-sort="nomer" >Номер</a></th>
                    <th><a class="sorted" sd:pagination-sort="datetime" >Отправление</a></th>
                    <th><a class="sorted" sd:pagination-sort="marshrut" >Маршрут</a>
                        <form   id="frmSel"
                                method="get"
                                role="form"
                                th:action="@{/}"
                           >
                            <input class="findtext"
                                    id="find"
                                    name="find"
                                    th:value="${find}"
                                    type="text"
                            />
                        </form>
                    </th>
                    <th>Плацкарт</th>
                    <th>Купе</th>
                    <th>Общиих</th>
                    <th>Спальных</th>
                    <th>Сидячих</th>
                    <th>Операции</th>
                </tr>
            </thread>
            <tbody>
            <tr th:each="pdl : ${pzdlist}">
                <td th:text="${pdl.nomer}"></td>
                <td th:text="${#temporals.format(pdl.datetime, 'dd.MM.yyyy HH:mm')}"></td>
                <td th:text="${pdl.marshrut}"></td>
                <td th:text="${pdl.platsckart}"></td>
                <td th:text="${pdl.kupe}"></td>
                <td th:text="${pdl.common}"></td>
                <td th:text="${pdl.spalnyi}"></td>
                <td th:text="${pdl.sitten}"></td>
                <td>
                    <div style="display: flex; justify-content: space-between;">
                        <div><a th:href="@{/user/ticket(uid=${pdl.id})}">[Купить билет]</a>&nbsp;</div>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>
        </div>
        <BR/>
        <div class="row">
            <div class="col-sm-6" >
                <div sd:pagination-summary=""  sd:page-object="${pzdlist}">info</div>
            </div>
            <div class="col-sm-6">
                <nav class="pull-right">
                    <ul class="pagination" sd:pagination-split="7" sd:pagination="full" sd:page-object="${pzdlist}">
                        <!-- Pagination created by SpringDataDialect, this content is just for mockup -->
                        <li class="disabled"><a href="#" aria-label="Previous"><span aria-hidden="true">&laquo;</span></a></li>
                        <li class="active"><a href="#">1 <span class="sr-only">(current)</span></a></li>
                    </ul>
                </nav>
            </div>
        </div>

    </div>
</div>
