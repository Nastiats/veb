<div th:fragment="body">

    <div class="containeer">
        <div class="row col-md-10">
            <h2>Формирование поездов</h2>
        </div>
        <div>
            <a th:href="@{/admin/poezd/new}">[Новый]</a>
        </div>
        <table >
            <thread>
                <tr>
                    <th>Номер</th>
                    <th>Дата и время отправления</th>
                    <th>Маршрут</th>
                    <th>Операции</th>
                </tr>
            </thread>
            <tbody>
            <tr th:each="tbl : ${pzd}">
                <td th:text="${tbl.nomer}"></td>
                <td th:text="${tbl.editdatetime}"></td>
                <td th:text="${tbl.marshrutname}"></td>
                <td>
                    <div style="display: flex; justify-content: space-between;">
                        <div><a th:href="@{/admin/poezd/edit(uid=${tbl.id})}">[Правка]</a>&nbsp;</div>
                        <div><a th:href="@{/admin/poezd/delete(uid=${tbl.id})}">[Удалить]</a>&nbsp;</div>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>
        <BR/>
        <div class="row">
            <div class="col-sm-6" >
                <div sd:pagination-summary=""  sd:page-object="${pzd}">info</div>
            </div>
            <div class="col-sm-6">
                <nav class="pull-right">
                    <ul class="pagination" sd:pagination-split="7" sd:pagination="full" sd:page-object="${pzd}">
                        <!-- Pagination created by SpringDataDialect, this content is just for mockup -->
                        <li class="disabled"><a href="#" aria-label="Previous"><span aria-hidden="true">&laquo;</span></a></li>
                        <li class="active"><a href="#">1 <span class="sr-only">(current)</span></a></li>
                    </ul>
                </nav>
            </div>
        </div>

        <div>
            <a th:href="@{/admin/poezd/new}">[Новый]</a>
        </div>
    </div>
</div>
