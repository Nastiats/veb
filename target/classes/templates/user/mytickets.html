<div th:fragment="body">
    <div class="row col-md-10">
        <h2>Мои билеты</h2>
       <table>
           <thread>
                 <tr>
                     <th><a class="sorted" sd:pagination-sort="datetime" >Дата отправления</a></th>
                     <th><a class="sorted" sd:pagination-sort="nomer" >Номер поезда и направление</a></th>
                     <th>Вагон</th>
                     <th>Количество мест</th>
                     <th>Цена места</th>
                 </tr>
           </thread>
           <tbody>
                <tr th:each="uu : ${ust}">
                    <td th:text="${#temporals.format(uu.datetime, 'dd.MM.yyyy HH:mm')}"></td>
                    <td><span th:text="${uu.nomer}"></span>&nbsp;<span th:text="${uu.marshrut}"></span></td>
                    <td><span th:text="${uu.vgnum}"></span>(<span th:text="${uu.vgname}"></span>)</td>
                    <td th:text="${uu.count}"></td>
                    <td th:text="${uu.cost}"></td>
                </tr>
           </tbody>
       </table>
        <BR/>
        <div class="row">
            <div class="col-sm-6" >
                <div sd:pagination-summary=""  sd:page-object="${ust}">info</div>
            </div>
            <div class="col-sm-6">
                <nav class="pull-right">
                    <ul class="pagination" sd:pagination-split="7" sd:pagination="full" sd:page-object="${ust}">
                        <!-- Pagination created by SpringDataDialect, this content is just for mockup -->
                        <li class="disabled"><a href="#" aria-label="Previous"><span aria-hidden="true">&laquo;</span></a></li>
                        <li class="active"><a href="#">1 <span class="sr-only">(current)</span></a></li>
                    </ul>
                </nav>
            </div>
        </div>

    </div>
</div>
